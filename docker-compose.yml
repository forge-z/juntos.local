services:
  app:
    build: .

    environment:
      APP_PORT: ${APP_PORT:-3000}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_ORIGIN: ${APP_ORIGIN:-https://juntos.forgez.me}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TZ: ${TZ:-America/Sao_Paulo}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}

    expose:
      - "3000"

    volumes:
      - juntos-data:/app/data
      - juntos-backups:/app/backups

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  juntos-data:
  juntos-backups:
