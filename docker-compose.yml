services:
  app:
    build: .
    env_file: .
    ports:
      # Restrinja a publicação ao próprio host por padrão durante o bootstrap.
      # Para expor atrás de um proxy/rede, defina HOST_BIND explicitamente.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-4205}:3000"
    volumes:
      - juntos-data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  juntos-data:
