services:
  app:
    build: .
    # Não use env_file aqui: o .env é local e fica fora do Git. O Coolify
    # injeta estas variáveis pela configuração do serviço; o Compose local
    # continua obtendo os valores do .env para a interpolação abaixo.
    environment:
      APP_PORT: ${APP_PORT:-3000}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4205}
      TZ: ${TZ:-America/Sao_Paulo}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      DATA_DIR: /app/data
    ports:
      # Restrinja a publicação ao próprio host por padrão durante o bootstrap.
      # Para expor atrás de um proxy/rede, defina HOST_BIND explicitamente.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-4205}:3000"
    volumes:
      - juntos-data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  juntos-data:
